<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --line: #d9d7d0;
    --accent: #2f6fde;
    --dot: #e0352b;
    --partial: #0b7d8c;
    --ok: #1a7f37;
    --bad: #cf222e;
    --ok-bg: #e6f4ea;
    --bad-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416;
      --card: #1e1e21;
      --ink: #ececef;
      --muted: #9a9aa2;
      --line: #36363b;
      --accent: #6b9bff;
      --dot: #ff6b5e;
      --partial: #4fc3d1;
      --ok: #56d364;
      --bad: #ff7b72;
      --ok-bg: #1b2e20;
      --bad-bg: #3a1d1d;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
    line-height: 1.5;
    padding: 24px 16px 48px;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }

  /* step indicator */
  .steps { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .steps li {
    list-style: none; padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); font-size: 0.85rem;
  }
  .steps li.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .steps li.done { color: var(--ok); border-color: var(--ok); }
  .steps { padding: 0; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px; margin-bottom: 16px;
  }
  .hidden { display: none !important; }

  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
  input {
    width: 100%; font: inherit; font-size: 1.25rem; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; font-weight: 600; font-size: 1rem; padding: 10px 20px;
    border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: progress; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  .status { margin-top: 14px; font-size: 0.9rem; color: var(--muted); min-height: 1.5em; }
  .status.error { color: var(--bad); }
  .status.ok { color: var(--ok); }

  /* ---- the worked solution: one fixed-width cell per character ---- */
  .work-wrap { overflow-x: auto; padding-bottom: 4px; }
  .work { font-size: 1.9rem; line-height: 1.35; display: inline-block; }
  .row { display: flex; align-items: baseline; white-space: nowrap; }
  .cell { width: 1.5ch; text-align: center; position: relative; flex: none; }
  .cell.op { color: var(--muted); }
  .cell.partial { color: var(--partial); }
  /* a real decimal point, drawn on the boundary between two digit columns
     so that every digit stays in its column */
  .cell.dot-after::after {
    content: "."; position: absolute; right: -0.5ch; width: 1ch; bottom: 0;
    text-align: center; color: var(--dot); font-weight: 800;
  }
  .rule-row { display: flex; height: 0.45em; }
  .rule-row .cell { height: 0; }
  .rule-row .cell.on { border-top: 3px solid var(--ink); }
  .note { font-size: 0.8rem; color: var(--muted); margin-left: 2ch; }

  .places { color: var(--muted); font-size: 0.9rem; margin: 16px 0 0; }
  .verdict {
    margin-top: 20px; padding: 14px 16px; border-radius: 8px; font-size: 1.05rem;
  }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.bad { background: var(--bad-bg); color: var(--bad); }
  .verdict b { font-weight: 800; }
  .actions { margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>Multiplication</h1>
  <p class="sub">Type the problem and your answer. The solution appears only after your parent has been emailed.</p>

  <ol class="steps">
    <li id="s0">0 · Parent</li>
    <li id="s1">1 · Your answer</li>
    <li id="s2">2 · Solution</li>
  </ol>

  <!-- step 0 -->
  <section id="step0" class="card">
    <div id="step0-body">Connecting to the email service…</div>
    <div class="actions hidden" id="step0-actions"><button id="start">Start</button></div>
    <div class="status" id="status0"></div>
  </section>

  <!-- step 1 -->
  <section id="step1" class="card hidden">
    <form id="form" autocomplete="off">
      <div class="fields">
        <div><label for="x">x</label><input id="x" inputmode="decimal" required placeholder="12.5"></div>
        <div><label for="y">y</label><input id="y" inputmode="decimal" required placeholder="3.25"></div>
        <div><label for="answer">x × y = ?</label><input id="answer" inputmode="decimal" required placeholder="your answer"></div>
      </div>
      <button id="submit" type="submit">Send answer &amp; show solution</button>
    </form>
    <div class="status" id="status1"></div>
  </section>

  <!-- step 2 -->
  <section id="step2" class="card hidden">
    <div class="work-wrap"><div class="work" id="work"></div></div>
    <p class="places" id="places"></p>
    <div class="verdict" id="verdict"></div>
    <div class="status" id="status2"></div>
    <div class="actions"><button class="secondary" id="again">Try another one</button></div>
  </section>
</main>

<script>
// Web app URL of the Google Apps Script (apps-script/Code.gs), ends with /exec.
const API_URL = 'https://script.google.com/macros/s/AKfycbyBVujcvyqH-JEHmyGNkuJRaTP7Gr2rmSFAAmmhqerrejWtgS8z_F31ezN2evkfrBZY5A/exec';

const $ = id => document.getElementById(id);
const NUMBER = /^[+-]?(\d+\.?\d*|\.\d+)$/;

function setStatus(id, text, kind) {
  const el = $(id);
  el.textContent = text;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

function showStep(n) {
  [0, 1, 2].forEach(i => {
    $('step' + i).classList.toggle('hidden', i !== n);
    $('s' + i).className = i === n ? 'active' : i < n ? 'done' : '';
  });
}

// Every response is JSON {ok, ...}; anything else counts as a failure.
async function call(method, body) {
  const res = await fetch(API_URL, method === 'GET' ? {} : {
    method: 'POST',
    body: JSON.stringify(body),   // text/plain: no CORS preflight for Apps Script
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'The server reported an error.');
  return data;
}

// ---- step 0 ---------------------------------------------------------------

async function init() {
  showStep(0);
  if (!/^https:\/\/script\.google\.com\//.test(API_URL)) {
    $('step0-body').textContent = 'Not set up yet: put the Apps Script web app URL into API_URL in this page.';
    return;
  }
  try {
    await call('GET');
    $('step0-body').textContent = 'Each answer, with its solution, will be emailed to your parent.';
    $('step0-actions').classList.remove('hidden');
    $('start').focus();
  } catch (err) {
    $('step0-body').textContent = 'Cannot reach the email service.';
    setStatus('status0', String(err.message || err), 'error');
  }
}

$('start').addEventListener('click', () => { showStep(1); $('x').focus(); });

// ---- step 1 ---------------------------------------------------------------

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const x = $('x').value.trim().replace(',', '.');
  const y = $('y').value.trim().replace(',', '.');
  const answer = $('answer').value.trim().replace(',', '.');
  for (const [name, v] of [['x', x], ['y', y], ['your answer', answer]]) {
    if (!NUMBER.test(v)) { setStatus('status1', `"${v}" is not a valid number for ${name}.`, 'error'); return; }
  }

  $('submit').disabled = true;
  setStatus('status1', 'Emailing your parent…');
  try {
    // The server emails first and only then returns the solution.
    const data = await call('POST', { action: 'submit', x, y, answer });
    setStatus('status1', '');
    showSolution(data);
  } catch (err) {
    setStatus('status1', 'The email could not be sent, so the solution stays hidden. ' + (err.message || err), 'error');
  } finally {
    $('submit').disabled = false;
  }
});

// ---- step 2 ---------------------------------------------------------------

// Draws the layout computed by the server:
//   { width, rows: [ {op, cells: [{ch, cls, dot}], note} | {rule: n} ] }
function renderWork(w) {
  const { width, rows } = w.layout;
  const box = $('work');
  box.innerHTML = '';
  for (const r of rows) {
    const row = document.createElement('div');
    row.className = r.rule ? 'rule-row' : 'row';
    const cell = (text, cls) => {
      const c = document.createElement('span');
      c.className = 'cell' + (cls ? ' ' + cls : '');
      c.textContent = text;
      row.append(c);
    };
    cell(r.op || '', 'op');
    if (r.rule) {
      for (let i = 0; i < width; i++) cell('', i >= width - r.rule ? 'on' : '');
    } else {
      for (let i = 0; i < width - r.cells.length; i++) cell('');
      for (const c of r.cells) cell(c.ch, [c.cls, c.dot && 'dot-after'].filter(Boolean).join(' '));
      if (r.note) {
        const n = document.createElement('span');
        n.className = 'note';
        n.textContent = r.note;
        row.append(n);
      }
    }
    box.append(row);
  }
  $('places').textContent = w.placesText;
}

function showSolution(data) {
  renderWork(data.work);
  const v = $('verdict');
  v.className = 'verdict ' + (data.correct ? 'ok' : 'bad');
  v.innerHTML = '';
  const b = document.createElement('b');
  b.textContent = data.correct ? 'Correct!' : 'Not quite.';
  v.append(b, ` ${data.work.problem} = ${data.work.resultText}  (your answer: ${data.answer})`);
  setStatus('status2', 'Your parent has been emailed ✓', 'ok');
  showStep(2);
}

$('again').addEventListener('click', () => {
  $('form').reset();
  setStatus('status2', '');
  showStep(1);
  $('x').focus();
});

init();
</script>
</body>
</html>
